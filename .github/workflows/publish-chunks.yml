name: publish-chunks

# All binary download hosts (actions artifact CDN, release assets, raw, git)
# are unreachable from the development machine; only api.github.com answers.
# So: take a finished build's kernel, gzip it, split into 4 MB parts and push
# them to the orphan branch "artifacts". The workstation then pulls part_NN
# one by one through the contents API (Accept: application/vnd.github.raw),
# which is served directly by api.github.com with no redirect.
on:
  workflow_dispatch:
    inputs:
      run_id:
        description: "workflow run id whose cas-h6-kernel artifact to publish"
        required: true
        default: "43613598788"
      label:
        description: "label written into the branch (informational)"
        required: true
        default: "run6-usbconsole"

permissions:
  contents: write
  actions: read

jobs:
  publish:
    runs-on: ubuntu-22.04
    steps:
      - name: fetch artifact of the given run
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          ID=$(gh api "repos/${{ github.repository }}/actions/runs/${{ inputs.run_id }}/artifacts" \
               --jq '.artifacts[] | select(.name=="cas-h6-kernel") | .id')
          echo "artifact id = $ID"
          test -n "$ID"
          curl -sSL --retry 5 --retry-delay 3 -H "Authorization: token $GH_TOKEN" \
            -o k.zip "https://api.github.com/repos/${{ github.repository }}/actions/artifacts/$ID/zip"
          mkdir -p art && unzip -o k.zip -d art
          ls -l art

      - name: split and publish to branch "artifacts"
        run: |
          set -euo pipefail
          mkdir -p stage
          gzip -9 -c art/Image > stage/Image.gz
          sha256sum art/Image | awk '{print $1}' > stage/Image.sha256
          echo "${{ inputs.label }}" > stage/LABEL
          split -b 4000000 -d -a 2 stage/Image.gz stage/part_
          ls -l stage
          cd stage
          git init -q
          git config user.email "ci@users.noreply.github.com"
          git config user.name  "cas-h6 ci"
          git add -A
          git commit -qm "kernel ${{ inputs.label }} (run ${{ inputs.run_id }})"
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" HEAD:artifacts
